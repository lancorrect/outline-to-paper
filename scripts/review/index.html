<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft review</title>
<!-- Math: KaTeX from a CDN renders $...$ and $$...$$ in the draft; offline, the LaTeX source is shown instead -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2f6fde; --accent-soft: #e6eefc; --sel: #fff3c4; --ann: #f0a04b;
    --q: #d9822b; --chg: #2f6fde; --sty: #8a8a8f; --ok: #2e8b57; --warn: #b3261e;
    --outline-bg: #f2f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #e8e8ea; --muted: #9a9aa1; --line: #33343a;
      --accent: #6b9cff; --accent-soft: #23314d; --sel: #4a4122; --ann: #e0954a;
      --q: #e0954a; --chg: #6b9cff; --sty: #8f8f96; --ok: #5cbf86; --warn: #ff8a80;
      --outline-bg: #26272b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; padding: 10px 20px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 200px; }
  #status { color: var(--muted); font-size: 13px; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--accent); padding: 0 4px; }
  label.toggle { font-size: 13px; color: var(--muted); }
  #banner { margin: 12px 20px 0; }
  .banner { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; border: 1px solid var(--line); }
  .banner.warn { color: var(--warn); }
  .banner.ok { color: var(--ok); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; padding: 16px 20px 80px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } #side { position: static !important; max-height: none !important; } }
  #doc { max-width: 820px; }
  .para { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
  .para.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .para-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .para-head .grow { flex: 1; }
  .para-text { font-family: "Charter", "Georgia", serif; font-size: 16px; line-height: 1.75; }
  .marker { color: var(--muted); margin-right: 4px; }
  .sent { cursor: pointer; border-radius: 3px; padding: 1px 0; }
  .sent:hover { background: var(--accent-soft); }
  .sent.has-ann { text-decoration: underline; text-decoration-color: var(--ann); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .sent.selected { background: var(--sel); }
  .cite { color: var(--muted); font-size: 13px; }
  .red { color: #d1242f; }
  .badge { display: inline-block; font: 600 11px/1 -apple-system, sans-serif; padding: 2px 4px; border-radius: 4px;
           color: #fff; vertical-align: super; margin-left: 2px; cursor: pointer; }
  .badge.question { background: var(--q); } .badge.change { background: var(--chg); } .badge.style { background: var(--sty); }
  .count { background: var(--ann); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; }
  .outline { margin-top: 8px; background: var(--outline-bg); border-radius: 6px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .outline b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .hide-outline .outline { display: none; }
  /* Changes from the previous version: added words on green, deleted words struck through in red; whole new sentences on green, whole deleted sentences struck through */
  ins { background: var(--ins-bg); text-decoration: none; border-radius: 2px; }
  del { color: var(--warn); text-decoration: line-through; }
  .sent.newsent { background: var(--ins-bg); }
  del.delsent { display: inline; opacity: .8; margin-right: 4px; }
  /* Submit result dialog: fixed in the middle of the screen, visible wherever the page is scrolled */
  #modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #modal[hidden] { display: none; }
  .modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; max-width: 460px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .modal-box h2 { margin: 0 0 8px; font-size: 16px; }
  .modal-box.ok h2 { color: var(--ok); } .modal-box.fail h2 { color: var(--warn); }
  :root { --ins-bg: #d6f5dc; }
  @media (prefers-color-scheme: dark) { :root { --ins-bg: #1f4a2b; } }
  #side { position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 80px); overflow: auto;
          background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  #side h2 { font-size: 14px; margin: 0 0 8px; }
  #side h3 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
  .snapshot { font-family: "Charter", "Georgia", serif; font-size: 14px; background: var(--sel); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  .note { border-left: 3px solid var(--line); padding: 4px 8px; margin: 6px 0; font-size: 13px; }
  .note.question { border-color: var(--q); } .note.change { border-color: var(--chg); } .note.style { border-color: var(--sty); }
  .note .kind { font-weight: 600; margin-right: 4px; }
  .ann { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 13px; }
  .ann .meta { color: var(--muted); font-size: 12px; }
  .ann .sugg { margin-top: 4px; color: var(--ok); }
  .ann .where { color: var(--muted); font-size: 12px; cursor: pointer; }
  form { display: grid; gap: 6px; margin-top: 8px; }
  select, textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; width: 100%; }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12px; }
  .para-text .katex-display { margin: 0.6em 0; }
  /* Rich layout (rich_layout: true in the config): the content between headings forms one card, lists and tables keep their form;
     drafts without it use the legacy one-card-per-paragraph view and never use these styles */
  #doc.rich { max-width: 980px; }
  .rich .doc-h { margin: 26px 0 10px; line-height: 1.35; }
  .rich h2.doc-h { font-size: 20px; } .rich h3.doc-h { font-size: 16px; } .rich h4.doc-h { font-size: 15px; }
  .rich .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .rich .blk { position: relative; border-left: 3px solid transparent; border-radius: 4px; padding: 3px 30px 3px 8px; margin: 4px 0;
               font-size: 15.5px; line-height: 1.75; }
  .rich .blk:hover { background: var(--bg); }
  .rich .blk.selected { border-left-color: var(--accent); background: var(--accent-soft); }
  /* Paragraph tools (ID, annotate) float in on hover or selection; a paragraph with annotations always shows a count on the right */
  .rich .tools { position: absolute; top: 2px; right: 4px; z-index: 2; display: none; gap: 6px; align-items: center;
                 font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
                 border-radius: 5px; padding: 1px 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .rich .blk:hover > .tools, .rich .blk.selected > .tools { display: flex; }
  .rich .pcount { position: absolute; top: 5px; right: 6px; }
  .rich .tools button { font-size: 11px; padding: 0 6px; }
  .rich .item { display: flex; gap: 6px; padding-left: calc(8px + var(--indent, 0) * 22px); margin: 2px 0; }
  .rich .item .marker { flex: none; min-width: 1.2em; text-align: right; }
  .rich .item .body { flex: 1; min-width: 0; }
  .rich .list { margin: 6px 0 8px; }
  .rich .tbl-wrap { overflow-x: auto; margin: 4px 0; }
  .rich table { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.6; }
  .rich th, .rich td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; min-width: 6.5em; }
  .rich th { background: var(--outline-bg); font-weight: 600; }
  .rich code { font-size: 0.9em; background: var(--outline-bg); border-radius: 3px; padding: 0 3px; }
  .katex { font-size: 1.05em; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="status"></span>
  <label class="toggle"><input type="checkbox" id="showOutline" checked> <span data-t="show_outline"></span></label>
  <label class="toggle" id="diffToggle" hidden><input type="checkbox" id="showDiff" checked> <span data-t="show_diff"></span></label>
  <button id="docBtn" data-t="doc_btn"></button>
  <button id="overviewBtn" data-t="overview_btn"></button>
  <button id="copyBtn" data-t="copy_btn" data-t-title="copy_title"></button>
  <button id="submitBtn" class="primary" data-t="submit_btn"></button>
  <button id="finalizeBtn" class="primary" data-t="finalize_btn" data-t-title="finalize_title"></button>
</header>
<div id="banner"></div>
<div id="modal" hidden><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" id="modalOk" data-t="modal_ok"></button></div></div></div>
<main>
  <div id="doc"></div>
  <aside id="side"></aside>
</main>
<script>
"use strict";
// State: doc comes from /api/doc (the draft split into paragraphs and sentences, the outline, the agent's notes,
// and the language table); annotations are the user's, saved to /api/save after every change. target records what
// is annotated and snapshot keeps the original text, so an annotation stays readable after the draft changes.
let doc = null, annotations = [], selected = null, submitted = false, saveTimer = null, L = {};
// T(key, vars): a string from the language table with {name} placeholders filled in
const T = (k, v = {}) => String(L[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => (v[n] ?? ""));
const KIND = (k) => T(["question", "change", "style"].includes(k) ? "kind_" + k : "kind_other");
const KIND_FULL = (k) => T(["question", "change", "style"].includes(k) ? "kind_full_" + k : "kind_full_other");
function applyStatic() {
  document.documentElement.lang = T("html_lang");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
  document.querySelectorAll("[data-t-title]").forEach((el) => { el.title = T(el.dataset.tTitle); });
}
const $ = (s) => document.querySelector(s);

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// ==…== shows as red text, used in outline drafts to mark the changes of this round.
function fmt(s) {
  // Inline code `...` is rendered only in rich layout; legacy drafts display as before
  const base = doc && doc.rich ? esc(s).replace(/`([^`]+)`/g, "<code>$1</code>") : esc(s);
  const out = base.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/==(.+?)==/gs, '<span class="red">$1</span>');
  // Grey citation keys only in paper drafts; rich layout is mostly plans and summaries, where brackets are often slots
  return doc && doc.rich ? out : out.replace(/(\[[a-z0-9_;\s]+\])/g, '<span class="cite">$1</span>');
}
// Render $...$ and $$...$$ inside an element. If KaTeX did not load (offline), do nothing; annotating still works.
// The change view renders too: the server treats each formula as one token (diff_tokens), so no formula is split.
// Elements with the class rawtex are not rendered, for when the LaTeX source must be shown.
function typeset(el) {
  if (!el || typeof window.renderMathInElement !== "function") return;
  window.renderMathInElement(el, {
    delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
    ignoredClasses: ["rawtex"], throwOnError: false,
  });
}
// A display formula in the outline spans several lines ($$ alone, the formula, $$ alone), so shown line by line
// the two $$ fall on different lines and cannot render; join the lines from $$ to $$ into one, labeled L15-L17.
function outlineRows(lines) {
  const rows = [];
  for (let i = 0; i < lines.length; i++) {
    const o = lines[i];
    if (o.text.trim() === "$$") {
      let j = i + 1;
      while (j < lines.length && lines[j].text.trim() !== "$$") j++;
      if (j < lines.length) {
        rows.push({ label: `L${o.line}-L${lines[j].line}`, text: lines.slice(i, j + 1).map((x) => x.text.trim()).join(" ") });
        i = j; continue;
      }
    }
    rows.push({ label: `L${o.line}`, text: o.text });
  }
  return rows;
}
function newId() { return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function now() { return new Date().toISOString().slice(0, 19); }

function findPara(pid) { return doc.paragraphs.find((p) => p.pid === pid); }
function findSent(sid) { for (const p of doc.paragraphs) for (const s of p.sentences) if (s.sid === sid) return [p, s]; return [null, null]; }
function targetKey(t) { return t.type === "document" ? "doc" : t.type === "paragraph" ? t.pid : t.sid; }
function annsFor(t) { return annotations.filter((a) => targetKey(a.target) === targetKey(t)); }
function snapshotOf(t) {
  // After the draft changes, the sentence of an old annotation may be gone; fall back to the stored snapshot
  if (t.type === "sentence") { const s = findSent(t.sid)[1]; return s ? s.text : (t.snapshot || T("sent_missing")); }
  if (t.type === "paragraph") { const p = findPara(t.pid); return p ? p.text : (t.snapshot || T("para_missing")); }
  return T("whole_doc");
}
// An annotation target keeps only type, pid and sid; a sentence carries the pid of its paragraph, which the server uses to group the readable file
function cleanTarget(t) {
  if (t.type === "sentence") { const p = findSent(t.sid)[0]; return { type: "sentence", pid: p ? p.pid : t.pid, sid: t.sid }; }
  if (t.type === "paragraph") return { type: "paragraph", pid: t.pid };
  return { type: "document" };
}
function labelOf(t) {
  if (t.type === "document") return T("whole_doc");
  if (t.type === "paragraph") return T("label_para", { pid: t.pid });
  return T("label_sent", { sid: t.sid });
}

async function load() {
  const [d, st] = await Promise.all([fetch("/api/doc").then((r) => r.json()), fetch("/api/state").then((r) => r.json())]);
  doc = d; annotations = st.annotations || []; submitted = !!st.submitted_at; L = doc.i18n || {};
  applyStatic();
  // doc_notes are notes on the whole document with no sentence to attach to; number them so they can be answered
  doc.doc_notes = (doc.doc_notes || []).map((n, i) => ({ nid: "d" + (i + 1), kind: n.kind || "question", text: n.text }));
  $("#title").textContent = doc.title || T("title_default");
  document.title = T("page_title", { title: doc.title });
  const banners = doc.warnings.map((w) => `<div class="banner warn">${esc(w)}</div>`);
  if (annotations.length && st.draft_sha1 && st.draft_sha1 !== doc.draft_sha1)
    banners.push(`<div class="banner warn">${esc(T("banner_changed_since"))}</div>`);
  if (doc.base && doc.diff_stats) {
    $("#diffToggle").hidden = false;
    const d = doc.diff_stats;
    banners.push(`<div class="banner">${T("banner_diff", { base: esc(doc.base), changed: d.changed, new: d.new, deleted: d.deleted })}</div>`);
  }
  if (submitted) banners.push(`<div class="banner ok">${esc(T("banner_submitted", { time: st.submitted_at }))}</div>`);
  $("#banner").innerHTML = banners.join("");
  setStatus(st.saved_at ? T("status_saved", { time: st.saved_at.slice(11) }) : T("status_none"));
  renderDoc(); renderSide();
}

function renderDoc() { return doc.rich ? renderRich() : renderLegacy(); }

// Rich layout: draw in the order of the server's layout; paragraphs, lists and tables between two headings form one card.
// Each paragraph (each list item, each table) keeps its pid, with an annotate button on hover; sentences stay clickable.
function sentHtml(s) {
  const has = annsFor({ type: "sentence", sid: s.sid }).length ? " has-ann" : "";
  const sel = selected && selected.type === "sentence" && selected.sid === s.sid ? " selected" : "";
  const badges = doc.notes.filter((n) => n.sid === s.sid)
    .map((n) => `<span class="badge ${n.kind}" data-sid="${s.sid}" title="${esc(KIND_FULL(n.kind))}">${esc(KIND(n.kind))}</span>`).join("");
  const diff = doc.base && $("#showDiff").checked;
  let body = fmt(s.text), cls = "";
  if (diff && s.change === "changed") body = s.segments.map(([op, t]) => {
    const h = fmt(t.replace(/\*\*/g, ""));
    return op === "ins" ? `<ins>${h}</ins>` : op === "del" ? `<del>${h}</del>` : h;
  }).join("");
  if (diff && s.change === "new") cls = " newsent";
  const delHtml = (list) => diff && list ? list.map((t) => `<del class="delsent">${fmt(t.replace(/\*\*/g, ""))}</del>`).join("") : "";
  return `${delHtml(s.deleted_before)}<span class="sent${has}${sel}${cls}" data-sid="${s.sid}">${body}</span>${badges}${delHtml(s.deleted_after)}`;
}
function renderRich() {
  const bySid = {};
  doc.paragraphs.forEach((p) => p.sentences.forEach((s) => { bySid[s.sid] = s; }));
  const cell = (sids) => sids.map((sid) => sentHtml(bySid[sid])).join(" ");
  const blockHtml = (p) => {
    const pAnn = annsFor({ type: "paragraph", pid: p.pid }).length;
    const psel = selected && selected.type === "paragraph" && selected.pid === p.pid ? " selected" : "";
    const ref = (p.outline || []).map((o) => "L" + o.line).join(T("ref_sep"));
    const tools = `${pAnn ? `<span class="count pcount">${pAnn}</span>` : ""}<div class="tools"><span>${p.pid}${ref ? esc(T("outline_ref", { ref })) : ""}</span>
      <button data-pid="${p.pid}">${esc(T("annotate_para"))}</button></div>`;
    let body;
    if (p.kind === "table") {
      const t = p.table;
      body = `<div class="tbl-wrap"><table><thead><tr>${t.header.map((c) => `<th>${cell(c)}</th>`).join("")}</tr></thead>
        <tbody>${t.rows.map((r) => `<tr>${r.map((c) => `<td>${cell(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    } else if (p.kind === "item") {
      const mk = /^\d+\.$/.test(p.marker) ? p.marker : "•";
      body = `<div class="item" style="--indent:${p.indent || 0}"><span class="marker">${esc(mk)}</span><div class="body">${cell(p.sentences.map((s) => s.sid))}</div></div>`;
    } else {
      body = cell(p.sentences.map((s) => s.sid));
    }
    const outline = outlineRows(p.outline || []).map((o) => `<div><b>${o.label}</b>${esc(o.text)}</div>`).join("");
    // Class names take a k- prefix so they do not clash with the legacy .para cards or the inner .item of list items
    return `<div class="blk k-${p.kind}${psel}" id="${p.pid}">${tools}${body}${outline ? `<div class="outline">${outline}</div>` : ""}</div>`;
  };
  let html = "", open = false;
  for (let i = 0; i < doc.layout.length; i++) {
    const b = doc.layout[i];
    if (b.type === "heading") {
      if (open) { html += "</section>"; open = false; }
      const lv = Math.min(Math.max(b.level, 2), 4);
      html += `<h${lv} class="doc-h" id="${b.hid}">${fmt(b.text)}</h${lv}>`;
      continue;
    }
    if (!open) { html += '<section class="sec">'; open = true; }
    const p = findPara(b.pid);
    if (p.kind === "item") {
      // Consecutive items of the same list go into one container, indented by indent
      html += '<div class="list">';
      while (i < doc.layout.length && doc.layout[i].type === "para") {
        const q = findPara(doc.layout[i].pid);
        if (q.kind !== "item" || q.list !== p.list) break;
        html += blockHtml(q); i++;
      }
      html += "</div>"; i--;
      continue;
    }
    html += blockHtml(p);
  }
  if (open) html += "</section>";
  $("#doc").innerHTML = html;
  $("#doc").classList.add("rich");
  $("#doc").classList.toggle("hide-outline", !$("#showOutline").checked);
  typeset($("#doc"));
}

function renderLegacy() {
  const html = doc.paragraphs.map((p) => {
    const pAnn = annsFor({ type: "paragraph", pid: p.pid }).length;
    const ref = (p.outline || []).map((o) => "L" + o.line).join(T("ref_sep"));
    const sents = p.sentences.map((s) => {
      const has = annsFor({ type: "sentence", sid: s.sid }).length ? " has-ann" : "";
      const sel = selected && selected.type === "sentence" && selected.sid === s.sid ? " selected" : "";
      const badges = doc.notes.filter((n) => n.sid === s.sid)
        .map((n) => `<span class="badge ${n.kind}" data-sid="${s.sid}" title="${esc(KIND_FULL(n.kind))}">${esc(KIND(n.kind))}</span>`).join("");
      // With a previous version, render changes: changed uses word-level segments, new is green, deleted old sentences are struck through in place
      const diff = doc.base && $("#showDiff").checked;
      let body = fmt(s.text), cls = "";
      if (diff && s.change === "changed") body = s.segments.map(([op, t]) => {
        const h = fmt(t.replace(/\*\*/g, ""));  // bold marks may fall into different segments, so the change view shows no bold
        return op === "ins" ? `<ins>${h}</ins>` : op === "del" ? `<del>${h}</del>` : h;
      }).join("");
      if (diff && s.change === "new") cls = " newsent";
      const delHtml = (list) => diff && list ? list.map((t) => `<del class="delsent">${fmt(t.replace(/\*\*/g, ""))}</del>`).join("") : "";
      return `${delHtml(s.deleted_before)}<span class="sent${has}${sel}${cls}" data-sid="${s.sid}">${body}</span>${badges}${delHtml(s.deleted_after)}`;
    }).join(" ");
    const outline = outlineRows(p.outline || []).map((o) => `<div><b>${o.label}</b>${esc(o.text)}</div>`).join("");
    const psel = selected && selected.type === "paragraph" && selected.pid === p.pid ? " selected" : "";
    return `<div class="para${psel}" id="${p.pid}">
      <div class="para-head"><span>${p.pid}${ref ? esc(T("outline_ref", { ref })) : ""}</span><span class="grow"></span>
        ${pAnn ? `<span class="count">${pAnn}</span>` : ""}<button data-pid="${p.pid}">${esc(T("annotate_para"))}</button></div>
      <div class="para-text">${p.marker ? `<span class="marker">${esc(p.marker)}</span>` : ""}${sents}</div>
      ${outline ? `<div class="outline">${outline}</div>` : ""}</div>`;
  }).join("");
  $("#doc").innerHTML = html;
  $("#doc").classList.toggle("hide-outline", !$("#showOutline").checked);
  typeset($("#doc"));
}

function noteHtml(n, target) {
  const reply = n.kind === "question"
    ? `<div class="row"><button class="link" data-agree="${n.nid}">${esc(T("agree"))}</button><span class="hint">${esc(T("or_own"))}</span></div>` : "";
  return `<div class="note ${n.kind}"><span class="kind">${esc(KIND_FULL(n.kind))}</span>${fmt(n.text)}${reply}</div>`;
}

function annHtml(a, showWhere) {
  const where = showWhere ? `<div class="where" data-goto="${esc(JSON.stringify(a.target))}">${esc(labelOf(a.target))}: ${esc(a.target.snapshot.slice(0, 60))}…</div>` : "";
  return `<div class="ann">${where}
    <div class="meta">${esc(a.category || T("md_uncategorized"))}${a.general ? esc(T("general_tag")) : ""}${a.reply_to ? esc(T("reply_tag")) + esc(a.reply_to) : ""}
      <button class="link" data-edit="${a.id}">${esc(T("edit"))}</button><button class="link" data-del="${a.id}">${esc(T("delete"))}</button></div>
    <div>${esc(a.comment)}</div>${a.suggestion ? `<div class="sugg">${esc(T("suggestion_label"))}${esc(a.suggestion)}</div>` : ""}</div>`;
}

function formHtml(edit) {
  const a = edit || {};
  const opts = [`<option value="">${esc(T("cat_placeholder"))}</option>`].concat(doc.categories.map((c) => `<option${a.category === c ? " selected" : ""}>${esc(c)}</option>`)).join("");
  // The form records the annotation being edited in data-editing, not data-edit: the click handler treats elements
  // with data-edit as the edit button, so every click in the textarea would redraw the side panel and lose the input.
  // There is no separate field for a suggested change; an old annotation that has one gets it merged into the comment.
  const body = (a.comment || "") + (a.suggestion ? "\n" + T("suggestion_label") + a.suggestion : "");
  return `<form id="annForm" data-editing="${a.id || ""}">
    <select name="category">${opts}</select>
    <textarea name="comment" placeholder="${esc(T("comment_placeholder"))}">${esc(body)}</textarea>
    <label class="hint"><input type="checkbox" name="general"${a.general ? " checked" : ""}> ${esc(T("general_label"))}</label>
    <div class="row"><button class="primary" type="submit">${esc(a.id ? T("save_edit") : T("add_ann"))}</button>
      ${a.id ? `<button type="button" data-cancel="1">${esc(T("cancel"))}</button>` : ""}</div></form>`;
}

function renderSide(editId) {
  const side = $("#side");
  if (!selected) {
    const qs = doc.notes.filter((n) => n.kind === "question");
    const qHtml = qs.map((n) => { const [, s] = findSent(n.sid);
      const done = annotations.some((a) => a.reply_to === n.nid);
      return `<div class="note question"><div class="where" data-goto='${esc(JSON.stringify({ type: "sentence", sid: n.sid }))}'>${done ? esc(T("replied")) : ""}${esc(n.sid)}: ${esc(s.text.slice(0, 50))}…</div>${fmt(n.text)}</div>`; }).join("");
    const dHtml = doc.doc_notes.map((n) => noteHtml(n)).join("");
    side.innerHTML = `<h2>${esc(T("overview"))}</h2>
      <div class="hint">${esc(T("overview_help"))}</div>
      <h3>${esc(T("questions_heading", { n: qs.length + doc.doc_notes.filter((n) => n.kind === "question").length }))}</h3>${qHtml}
      ${dHtml ? `<h3>${esc(T("doc_notes_heading"))}</h3>${dHtml}<div class="hint">${esc(T("doc_notes_help"))}</div>` : ""}
      <h3>${esc(T("all_anns_heading", { n: annotations.length }))}</h3>${annotations.map((a) => annHtml(a, true)).join("") || `<div class="hint">${esc(T("no_anns"))}</div>`}`;
    typeset(side);
    return;
  }
  const t = selected;
  const notes = t.type === "sentence" ? doc.notes.filter((n) => n.sid === t.sid) : t.type === "document" ? doc.doc_notes : [];
  const edit = editId ? annotations.find((a) => a.id === editId) : null;
  side.innerHTML = `<h2>${esc(labelOf(t))}</h2>
    ${t.type !== "document" ? `<div class="snapshot">${fmt(snapshotOf(t))}</div>` : ""}
    ${notes.map((n) => noteHtml(n, t)).join("")}
    ${annsFor(t).map((a) => annHtml(a, false)).join("")}
    ${formHtml(edit)}
    <div class="row" style="margin-top:10px"><button data-close="1">${esc(T("back_overview"))}</button></div>`;
  typeset(side.querySelector(".snapshot"));  // render only the snapshot; a $ in notes and annotations is usually plain text
  const ta = side.querySelector("textarea[name=comment]");
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }  // when editing, put the cursor at the end
}

function select(t) {
  selected = t ? cleanTarget(t) : null;
  renderDoc(); renderSide();
  const el = t && (t.type === "sentence" ? document.querySelector(`.sent[data-sid="${t.sid}"]`) : t.type === "paragraph" ? document.getElementById(t.pid) : null);
  if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function setStatus(s) { $("#status").textContent = s; }
function scheduleSave() {
  setStatus(T("status_saving"));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}
async function save() {
  try {
    const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ annotations }) });
    const j = await r.json(); setStatus(T("status_saved", { time: j.saved_at.slice(11) }));
  } catch (e) { setStatus(T("status_save_failed")); }
}

function addOrUpdate(fields, editId, replyTo) {
  if (editId) {
    const a = annotations.find((x) => x.id === editId);
    Object.assign(a, fields, { updated: now() });
  } else {
    annotations.push(Object.assign({ id: newId(), target: Object.assign({ snapshot: snapshotOf(selected) }, selected), created: now() },
      fields, replyTo ? { reply_to: replyTo } : {}));
  }
  scheduleSave(); renderDoc(); renderSide();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-sid],[data-pid],[data-agree],[data-edit],[data-del],[data-goto],[data-close],[data-cancel]");
  if (!el) return;
  // A drag or double-click that selected text is not a click on the sentence; redrawing would lose the selection
  const picked = window.getSelection();
  if (picked && !picked.isCollapsed && el.dataset.sid && !el.classList.contains("badge")) return;
  if (el.dataset.agree) {
    const n = doc.notes.concat(doc.doc_notes).find((x) => x.nid === el.dataset.agree);
    if (!selected) selected = cleanTarget(n.sid ? { type: "sentence", sid: n.sid } : { type: "document" });
    addOrUpdate({ category: T("agree_category"), comment: T("agree_comment"), suggestion: "", general: false }, null, n.nid);
  } else if (el.dataset.edit) { renderSide(el.dataset.edit); if (!selected) { const a = annotations.find((x) => x.id === el.dataset.edit); select(a.target); renderSide(a.id); } }
  else if (el.dataset.del) { if (confirm(T("confirm_delete"))) { annotations = annotations.filter((a) => a.id !== el.dataset.del); scheduleSave(); renderDoc(); renderSide(); } }
  else if (el.dataset.goto) { const t = JSON.parse(el.dataset.goto); select(t.type === "document" ? { type: "document" } : t); }
  else if (el.dataset.close) select(null);
  else if (el.dataset.cancel) renderSide();
  else if (el.dataset.pid && el.tagName === "BUTTON") select({ type: "paragraph", pid: el.dataset.pid });
  else if (el.dataset.sid) select({ type: "sentence", sid: el.dataset.sid });
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target, comment = f.comment.value.trim();
  if (!comment) { f.comment.focus(); return; }
  addOrUpdate({ category: f.category.value, comment, suggestion: "", general: f.general.checked }, f.dataset.editing || null);
});
document.addEventListener("keydown", (e) => {
  // Esc inside the form does not close it, so an unsaved annotation is not lost
  if (e.key === "Escape" && !e.target.closest("form")) select(null);
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && e.target.form) e.target.form.requestSubmit();
});
$("#docBtn").onclick = () => select({ type: "document" });
$("#overviewBtn").onclick = () => select(null);
$("#showOutline").onchange = renderDoc;
$("#showDiff").onchange = renderDoc;
// Submit and finalize use the same endpoint; finalize adds a flag, and the agent reading finalized finalizes directly
async function submit(finalize) {
  const open = doc.notes.filter((n) => n.kind === "question" && !annotations.some((a) => a.reply_to === n.nid || (a.target.sid === n.sid))).length;
  const msg = finalize
    ? (annotations.length ? T("confirm_finalize_with", { n: annotations.length }) : T("confirm_finalize_empty"))
    : T("confirm_submit", { n: annotations.length, open: open ? T("confirm_open", { k: open }) : "" });
  if (!confirm(msg)) return;
  clearTimeout(saveTimer);
  try {
    const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ annotations, finalize }) });
    if (!r.ok) throw new Error(T("server_returned", { code: r.status }));
    const j = await r.json();
    const what = finalize ? T("what_finalize") : T("what_submit");
    const after = j.exiting
      ? (finalize ? T("after_exit_finalize") : T("after_exit_submit"))
      : T("after_running", { what });
    showModal(true, T("modal_success_title", { what }), T("modal_success_body", { n: j.count, path: esc(j.json), time: esc(j.submitted_at.replace("T", " ")), after: esc(after) }));
    $("#banner").insertAdjacentHTML("afterbegin", `<div class="banner ok">${esc(T("banner_done", { what, time: j.submitted_at }))}</div>`);
    setStatus(j.exiting ? T("status_done_exit", { what }) : T("status_done", { what }));
  } catch (err) {
    // On failure the annotations are still in page memory; do not refresh, restart the server and submit again
    showModal(false, T("modal_fail_title"), T("modal_fail_body", { err: esc(err.message || err), btn: esc(finalize ? T("btn_quoted_finalize") : T("btn_quoted_submit")) }));
    setStatus(T("status_submit_failed"));
  }
}
$("#submitBtn").onclick = () => submit(false);
$("#finalizeBtn").onclick = () => submit(true);
// Copy all: drop bold marks, one blank line between paragraphs; fall back to execCommand without the clipboard API
$("#copyBtn").onclick = async () => {
  // Rich layout copies by layout: headings with #, tables back as Markdown rows, list items indented
  const richText = () => [doc.title].concat(doc.layout.map((b) => {
    if (b.type === "heading") return "#".repeat(b.level) + " " + b.text;
    const p = findPara(b.pid);
    if (p.kind === "table") { const rows = p.text.split("\n").map((r) => "| " + r + " |"); rows.splice(1, 0, "|" + " --- |".repeat(p.table.header.length)); return rows.join("\n"); }
    if (p.kind === "item") return "  ".repeat(p.indent || 0) + p.marker + " " + p.text;
    return p.text;
  })).join("\n\n").replace(/\*\*/g, "");
  const text = doc.rich ? richText() : [doc.title].concat(doc.paragraphs.map((p) => (p.marker ? p.marker + " " : "") + p.text.replace(/\*\*/g, ""))).join("\n\n");
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  setStatus(T("status_copied"));
};
function showModal(ok, title, html) {
  $("#modal .modal-box").className = "modal-box " + (ok ? "ok" : "fail");
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = html;
  $("#modal").hidden = false;
  $("#modalOk").focus();
}
$("#modalOk").onclick = () => { $("#modal").hidden = true; };
load().catch((e) => {
  // The language table may not have loaded; T falls back to English text here
  if (!L.load_failed) L = { load_failed: "Loading failed: {err}. Make sure the server is running." };
  $("#banner").innerHTML = `<div class="banner warn">${esc(T("load_failed", { err: e }))}</div>`;
});
</script>
</body>
</html>
